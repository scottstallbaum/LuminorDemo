<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luminor | BrewCo Cost Intelligence Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260324-3" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Luminor Demo</p>
      <h1>BrewCo Margin Intelligence</h1>
      <p class="subtitle">Interactive client preview for SKU, product family, plant, and packaging profitability.</p>
    </div>
    <div class="pill">Single Client Demo</div>
  </header>

  <main class="layout">
    <section class="panel controls controls-full compact-controls">
      <h2>Waterfall Filters</h2>
      <div class="grid-two compact-grid">
        <label>
          Plant
          <select id="filter-plant"></select>
        </label>
        <label>
          Product Family
          <select id="filter-family"></select>
        </label>
        <label>
          Packaging
          <select id="filter-packaging"></select>
        </label>
        <label>
          Drill Dimension
          <select id="drill-dimension"></select>
        </label>
        <label>
          Drill Value
          <select id="drill-value"></select>
        </label>
      </div>
      <button id="btn-reset" class="ghost">Reset Filters</button>
    </section>

    <section class="panel panel-wide">
      <h2>Revenue to Operating Income Waterfall (Current Slice)</h2>
      <div id="waterfall" class="waterfall"></div>
    </section>

  </main>

  <script src="data/demo-cost-data.js"></script>
  <script src="data/demo-descriptor-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js?v=20260324-7"></script>
</body>
</html>
