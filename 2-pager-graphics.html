<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Pager Graphics - Luminor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260421-2pager2" />
  <style>
    .layout {
      max-width: 1180px;
      margin: 0 auto;
      padding-top: 14px;
      padding-bottom: 20px;
      display: block;
    }

    .pg-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .pg-card {
      width: min(100%, 1040px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .85rem;
      padding: .9rem;
      box-shadow: 0 14px 32px rgba(0, 0, 0, .18);
    }

    .pg-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .pg-card-head h2 {
      margin: 0;
      color: var(--text);
      font-size: .98rem;
      letter-spacing: .01em;
    }

    .pg-chart-shell {
      width: min(100%, 960px);
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #0d1528;
      border: 1px solid var(--line);
      border-radius: .75rem;
      padding: .35rem;
    }

    #pg-whale-curve {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .pg-export {
      border: 1px solid var(--line);
      background: #0c1527;
      color: var(--text);
      border-radius: .55rem;
      padding: .45rem .75rem;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pg-export:hover {
      border-color: #3b4a68;
      background: #121d32;
    }

    .pg-note {
      margin-top: 8px;
      font-size: .78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Luminor Demo</p>
      <h1>2 Pager Graphics</h1>
      <p class="subtitle">Static, copy-ready thumbnails for marketing materials.</p>
    </div>
    <nav class="topbar-nav">
      <a href="index.html" class="ghost topbar-back">← Dashboard</a>
      <a href="delivery-time-graphs.html" class="ghost topbar-back">Delivery Time Graphs →</a>
      <a href="demand-prioritization.html" class="ghost topbar-back">Demand Prioritization →</a>
    </nav>
  </header>

  <main class="layout">
    <section class="pg-wrap">
      <div class="pg-card">
        <div class="pg-card-head">
          <h2>1. Cumulative Profit Concentration (Whale Curve)</h2>
          <button id="pg-copy-whale" class="pg-export" type="button">Copy Image</button>
        </div>
        <div class="pg-chart-shell">
          <canvas id="pg-whale-curve"></canvas>
        </div>
        <p id="pg-copy-status" class="pg-note">Tip: use Copy Image, then paste directly into your slide.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="2-pager-graphics.js?v=20260421-2pager1"></script>
</body>
</html>
