<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Pager Graphics - Luminor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260421-2pager1" />
  <style>
    .pg-wrap {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
    }

    .pg-card {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 22px rgba(2, 8, 23, 0.08);
    }

    .pg-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pg-card-head h2 {
      margin: 0;
      color: #111827;
      font-size: 18px;
      letter-spacing: 0.01em;
    }

    .pg-chart-shell {
      width: 100%;
      height: 360px;
      background: #ffffff;
      border-radius: 10px;
    }

    .pg-export {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #111827;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pg-export:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .pg-note {
      margin-top: 10px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Luminor Demo</p>
      <h1>2 Pager Graphics</h1>
      <p class="subtitle">Static, copy-ready thumbnails for marketing materials.</p>
    </div>
    <nav class="topbar-nav">
      <a href="index.html" class="ghost topbar-back">← Dashboard</a>
      <a href="delivery-time-graphs.html" class="ghost topbar-back">Delivery Time Graphs →</a>
      <a href="demand-prioritization.html" class="ghost topbar-back">Demand Prioritization →</a>
    </nav>
  </header>

  <main class="layout">
    <section class="panel panel-wide pg-wrap">
      <div class="pg-card">
        <div class="pg-card-head">
          <h2>1. Cumulative Profit Concentration (Whale Curve)</h2>
          <button id="pg-copy-whale" class="pg-export" type="button">Copy Image</button>
        </div>
        <div class="pg-chart-shell">
          <canvas id="pg-whale-curve"></canvas>
        </div>
        <p id="pg-copy-status" class="pg-note">Tip: use Copy Image, then paste directly into your slide.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="2-pager-graphics.js?v=20260421-2pager1"></script>
</body>
</html>
