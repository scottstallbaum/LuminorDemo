<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="28" y1="148" x2="298" y2="148" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <line x1="28" y1="30" x2="28" y2="148" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <line x1="28" y1="108" x2="298" y2="108" stroke="rgba(159,176,211,.12)" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Group 1: Premium - Adj (blue) taller than Std (teal) = overstatement -->
  <rect x="36" y="62" width="16" height="86" fill="#4f9fff" rx="1" opacity=".9"/>
  <rect x="54" y="75" width="16" height="73" fill="#45d0a2" rx="1" opacity=".85"/>
  <!-- Group 2: Budget -->
  <rect x="82" y="55" width="16" height="93" fill="#4f9fff" rx="1" opacity=".9"/>
  <rect x="100" y="68" width="16" height="80" fill="#45d0a2" rx="1" opacity=".85"/>
  <!-- Group 3: Near Prem -->
  <rect x="128" y="78" width="16" height="70" fill="#4f9fff" rx="1" opacity=".9"/>
  <rect x="146" y="88" width="16" height="60" fill="#45d0a2" rx="1" opacity=".85"/>
  <!-- Group 4: Above Prem -->
  <rect x="174" y="68" width="16" height="80" fill="#4f9fff" rx="1" opacity=".9"/>
  <rect x="192" y="80" width="16" height="68" fill="#45d0a2" rx="1" opacity=".85"/>
  <!-- Group 5: Unknown - reversed, std taller (understatement) -->
  <rect x="220" y="92" width="16" height="56" fill="#4f9fff" rx="1" opacity=".9"/>
  <rect x="238" y="82" width="16" height="66" fill="#45d0a2" rx="1" opacity=".9"/>
  <!-- legend dots -->
  <rect x="258" y="32" width="6" height="6" rx="1" fill="#4f9fff"/>
  <text x="266" y="38" fill="#9fb0d3" font-size="6" font-family="Inter,Arial">Adj</text>
  <rect x="258" y="44" width="6" height="6" rx="1" fill="#45d0a2"/>
  <text x="266" y="50" fill="#9fb0d3" font-size="6" font-family="Inter,Arial">Std</text>
</svg>
