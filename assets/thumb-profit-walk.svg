<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="22" y1="148" x2="302" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <line x1="22" y1="20" x2="22" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <!-- gridlines -->
  <line x1="22" y1="108" x2="302" y2="108" stroke="#1e2e48" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="22" y1="68"  x2="302" y2="68"  stroke="#1e2e48" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- The profit walk is a stepped area: each price segment is a column segment stacked -->
  <!-- Columns represent cumulative profit walk by segment, sorted by margin -->
  <!-- Segment 1: Premium - large positive -->
  <rect x="28"  y="52"  width="38" height="96" fill="#45d0a2" rx="1" opacity=".9"/>
  <!-- Segment 2: Above Prem -->
  <rect x="70"  y="72"  width="32" height="76" fill="#45d0a2" rx="1" opacity=".75"/>
  <!-- Segment 3: Near Prem - smaller positive -->
  <rect x="106" y="94"  width="30" height="54" fill="#4f9fff" rx="1" opacity=".8"/>
  <!-- Segment 4: Budget - small positive -->
  <rect x="140" y="110" width="36" height="38" fill="#4f9fff" rx="1" opacity=".7"/>
  <!-- Segment 5: Non Alc - small negative -->
  <rect x="180" y="148" width="28" height="18" fill="#ff6d6d" rx="1" opacity=".75"/>
  <!-- Segment 6: Unknown - large negative -->
  <rect x="212" y="148" width="34" height="38" fill="#ff6d6d" rx="1" opacity=".85"/>
  <!-- volume line (x-axis is volume) -->
  <text x="22" y="163" fill="#3d5270" font-size="6" font-family="Inter,Arial">Volume →</text>
  <text x="240" y="163" fill="#3d5270" font-size="6" font-family="Inter,Arial">Op Profit</text>
</svg>
