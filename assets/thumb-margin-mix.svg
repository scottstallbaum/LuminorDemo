<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="22" y1="148" x2="302" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <line x1="22" y1="20"  x2="22" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <!-- OM% zero line -->
  <line x1="22" y1="90" x2="302" y2="90" stroke="#1e2e48" stroke-width="0.8"/>
  <!-- company avg dashed line -->
  <line x1="22" y1="70" x2="302" y2="70" stroke="#b28cff" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
  <!-- Bars: width = revenue share, height = OM%. Above avg = green, below = red -->
  <!-- Premium: above avg, good margin -->
  <rect x="26"  y="36" width="62" height="54" fill="#45d0a2" rx="1" opacity=".85"/>
  <!-- Above Prem: slightly above avg -->
  <rect x="92"  y="62" width="34" height="28" fill="#45d0a2" rx="1" opacity=".75"/>
  <!-- Near Prem: just at avg -->
  <rect x="130" y="70" width="28" height="20" fill="#45d0a2" rx="1" opacity=".65"/>
  <!-- Budget: below avg, wide (high volume) -->
  <rect x="162" y="90" width="58" height="34" fill="#ff6d6d" rx="1" opacity=".8"/>
  <!-- Non Alc: well below zero -->
  <rect x="224" y="90" width="24" height="52" fill="#ff6d6d" rx="1" opacity=".85"/>
  <!-- Unknown -->
  <rect x="252" y="90" width="18" height="46" fill="#ff6d6d" rx="1" opacity=".7"/>
  <!-- avg label -->
  <text x="270" y="67" fill="#b28cff" font-size="6" font-family="Inter,Arial" opacity=".8">avg</text>
  <text x="22" y="163" fill="#3d5270" font-size="6" font-family="Inter,Arial">← Revenue width</text>
</svg>
