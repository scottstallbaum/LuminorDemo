<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="28" y1="148" x2="298" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <line x1="28" y1="20" x2="28" y2="148" stroke="#1e2e48" stroke-width="1"/>
  <!-- zero line at 50% height -->
  <line x1="28" y1="90" x2="298" y2="90" stroke="#1e2e48" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Adjusted OM curve: rises steeply then turns down (whale shape) -->
  <!-- peak is around x=110 -->
  <path d="M28 90 C50 85 70 50 110 30 C140 15 160 22 185 45 C210 68 240 95 298 110"
        stroke="#45d0a2" stroke-width="2.2" fill="none"/>
  <!-- fill under curve to zero -->
  <path d="M28 90 C50 85 70 50 110 30 C140 15 160 22 185 45 C210 68 240 95 298 110 L298 90 L28 90 Z"
        fill="#45d0a2" fill-opacity="0.08"/>
  <!-- area below zero (where curve is below zero line) is loss segment -->
  <!-- peak marker -->
  <circle cx="110" cy="30" r="3" fill="#45d0a2"/>
  <!-- crossover marker where curve crosses zero going down -->
  <circle cx="240" cy="95" r="3" fill="#ffae57"/>
  <!-- selected range highlight band -->
  <rect x="82" y="20" width="158" height="128" fill="#45d0a2" fill-opacity="0.05" rx="1"/>
  <line x1="82" y1="20" x2="82" y2="148" stroke="#45d0a2" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>
  <line x1="240" y1="20" x2="240" y2="148" stroke="#ffae57" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>
  <!-- x-axis label -->
  <text x="28" y="163" fill="#3d5270" font-size="6" font-family="Inter,Arial">0% SKUs</text>
  <text x="260" y="163" fill="#3d5270" font-size="6" font-family="Inter,Arial">100%</text>
</svg>
