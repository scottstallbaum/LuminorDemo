<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="26" y1="152" x2="300" y2="152" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <line x1="26" y1="18"  x2="26"  y2="152" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <!-- gridlines -->
  <line x1="26" y1="100" x2="300" y2="100" stroke="rgba(159,176,211,.12)" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="26" y1="60"  x2="300" y2="60"  stroke="rgba(159,176,211,.12)" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Adjusted line (green): starts at origin, rises steeply to peak ~x=155, then declines -->
  <!-- Fill under Adj line -->
  <path d="M26,152 C55,152 90,70 155,28 C195,12 240,45 300,88 L300,152 Z"
        fill="#45d0a2" fill-opacity="0.07"/>
  <path d="M26,152 C55,152 90,70 155,28 C195,12 240,45 300,88"
        stroke="#45d0a2" stroke-width="2" fill="none"/>
  <!-- Adj peak marker -->
  <circle cx="155" cy="28" r="3.5" fill="#45d0a2"/>

  <!-- Standard line (orange): starts at origin, rises to lower peak ~x=175, declines more -->
  <path d="M26,152 C55,152 100,92 175,48 C215,32 255,65 300,108"
        stroke="#ffae57" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <!-- Std peak marker -->
  <circle cx="175" cy="48" r="3" fill="#ffae57"/>

  <!-- axis labels -->
  <text x="26"  y="168" fill="#9fb0d3" font-size="6.5" font-family="Inter,Arial">0% SKUs</text>
  <text x="270" y="168" fill="#9fb0d3" font-size="6.5" font-family="Inter,Arial">100%</text>
  <!-- legend -->
  <line x1="224" y1="20" x2="238" y2="20" stroke="#45d0a2" stroke-width="2"/>
  <text x="241" y="23" fill="#9fb0d3" font-size="6" font-family="Inter,Arial">Adj</text>
  <line x1="224" y1="32" x2="238" y2="32" stroke="#ffae57" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="241" y="35" fill="#9fb0d3" font-size="6" font-family="Inter,Arial">Std</text>
</svg>
