<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" rx="4" fill="#0d1528"/>
  <!-- axes -->
  <line x1="26" y1="20" x2="26" y2="152" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <line x1="26" y1="152" x2="306" y2="152" stroke="rgba(159,176,211,.25)" stroke-width="1"/>
  <!-- gridlines -->
  <line x1="26" y1="100" x2="306" y2="100" stroke="rgba(159,176,211,.12)" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="26" y1="60"  x2="306" y2="60"  stroke="rgba(159,176,211,.12)" stroke-width="0.5" stroke-dasharray="3 3"/>
  <!-- Revenue bar -->
  <rect x="32"  y="30"  width="32" height="122" fill="#5da8ff" rx="2"/>
  <!-- connector Rev → Cost1 -->
  <line x1="64" y1="30" x2="72" y2="30" stroke="rgba(159,176,211,.55)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Cost 1: COGS (largest) -->
  <rect x="72"  y="30"  width="28" height="44" fill="#ff8c7a" rx="2"/>
  <!-- connector Cost1 → Cost2 -->
  <line x1="100" y1="74" x2="108" y2="74" stroke="rgba(159,176,211,.55)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Cost 2: SGA -->
  <rect x="108" y="74"  width="26" height="26" fill="#ff8c7a" rx="2"/>
  <!-- connector Cost2 → Cost3 -->
  <line x1="134" y1="100" x2="142" y2="100" stroke="rgba(159,176,211,.55)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Cost 3: Other -->
  <rect x="142" y="100" width="22" height="18" fill="#ff8c7a" rx="2"/>
  <!-- connector Cost3 → Result (long jump) -->
  <line x1="164" y1="118" x2="240" y2="118" stroke="rgba(159,176,211,.55)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Result: Op Income bar from baseline -->
  <rect x="240" y="118" width="38" height="34" fill="#43c99a" rx="2"/>
  <!-- labels -->
  <text x="48"  y="168" fill="#9fb0d3" font-size="7" font-family="Inter,Arial" text-anchor="middle">Revenue</text>
  <text x="259" y="168" fill="#9fb0d3" font-size="7" font-family="Inter,Arial" text-anchor="middle">Op Inc</text>
</svg>
